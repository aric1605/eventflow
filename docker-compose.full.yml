# ==============================================================================
# REFERENCE ONLY — NOT EXERCISED / NOT TESTED LOCALLY
# This compose file provides a blueprint for an on-premise or full-scale deployment
# utilizing Apache Kafka (KRaft mode), PostgreSQL, Redis, and EventFlow.
# ==============================================================================
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow_secure_password
      POSTGRES_DB: eventflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: eventflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventflow-app
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      PORT: 10000
      ROLE: all
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://eventflow:eventflow_secure_password@postgres:5432/eventflow?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_KEY: ef_prod_reference_secret_key_1234
      WORKER_CONCURRENCY: 5
      MAX_ATTEMPTS: 4
      RETRY_BASE_MS: 2000
      RETRY_MAX_MS: 60000
      VISIBILITY_TIMEOUT_MS: 30000
      HANDLER_TIMEOUT_MS: 8000
      IDLE_POLL_MAX_MS: 60000
      SWEEP_INTERVAL_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
